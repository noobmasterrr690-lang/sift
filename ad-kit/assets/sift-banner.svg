<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <radialGradient id="bannerBg" cx="20%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#141829" />
      <stop offset="100%" stop-color="#0b0c14" />
    </radialGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="markT1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="markT2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="markT3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Banner Background -->
  <rect x="0" y="0" width="800" height="240" rx="24" fill="url(#bannerBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Logo Mark Container (Scale ~ 0.38) -->
  <g transform="translate(48, 30) scale(0.35)" filter="url(#markShadow)">
    <rect x="24" y="24" width="464" height="464" rx="112" fill="#121526" stroke="#4f46e5" stroke-width="4" stroke-opacity="0.6" />
    
    <!-- Top Tier -->
    <path d="M 148 160 C 148 136, 168 116, 192 116 L 324 116 C 348 116, 368 136, 368 160 L 368 178 C 368 202, 348 222, 324 222 L 236 222 C 216 222, 200 206, 200 186 C 200 166, 216 150, 236 150 L 316 150 C 324 150, 332 143, 332 135 C 332 127, 324 120, 316 120 L 192 120 C 170 120, 152 138, 152 160 C 152 182, 170 200, 192 200 L 220 200 C 200 208, 184 218, 172 230 L 164 216 C 154 200, 148 181, 148 160 Z" fill="url(#markT1)" />
    
    <!-- Middle Tier -->
    <path d="M 368 196 C 368 218, 354 238, 334 246 L 216 294 C 192 304, 176 328, 176 354 L 176 364 C 152 364, 136 348, 136 324 L 136 312 C 136 286, 152 262, 176 252 L 294 204 C 318 194, 334 170, 334 144 L 334 140 C 354 146, 368 169, 368 196 Z" fill="url(#markT2)" />
    
    <!-- Bottom Tier -->
    <path d="M 364 352 C 364 376, 344 396, 320 396 L 188 396 C 164 396, 144 376, 144 352 L 144 334 C 144 310, 164 290, 188 290 L 276 290 C 296 290, 312 306, 312 326 C 312 346, 296 362, 276 362 L 196 362 C 188 362, 180 369, 180 377 C 180 385, 188 392, 196 392 L 320 392 C 342 392, 360 374, 360 352 C 360 330, 342 312, 320 312 L 292 312 C 312 304, 328 294, 340 282 L 348 296 C 358 312, 364 331, 364 352 Z" fill="url(#markT3)" />
    
    <!-- Core Diamond -->
    <path d="M 256 230 L 278 256 L 256 282 L 234 256 Z" fill="#ffffff" />
    
    <!-- Accents -->
    <rect x="390" y="128" width="22" height="10" rx="5" fill="#22d3ee" />
    <rect x="100" y="356" width="22" height="10" rx="5" fill="#fb7185" />
  </g>

  <!-- Typography: Wordmark -->
  <text x="252" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="74" font-weight="800" letter-spacing="-2.5" fill="url(#titleGrad)">Sift</text>

  <!-- Tagline / Descriptor -->
  <text x="255" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" letter-spacing="4" fill="url(#badgeGrad)">PRECISION FILE ORGANIZER</text>

  <!-- Feature Pill Tags -->
  <g transform="translate(255, 178)">
    <rect x="0" y="0" width="94" height="24" rx="12" fill="#1e293b" />
    <text x="47" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">Design Files</text>

    <rect x="104" y="0" width="82" height="24" rx="12" fill="#1e293b" />
    <text x="145" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">Smart Triage</text>

    <rect x="196" y="0" width="76" height="24" rx="12" fill="#1e293b" />
    <text x="234" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">100% Local</text>
  </g>
</svg>