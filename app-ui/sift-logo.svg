<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark glassmorphic background -->
    <radialGradient id="bgGradient" cx="50%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#1e2238" />
      <stop offset="45%" stop-color="#111322" />
      <stop offset="100%" stop-color="#090a12" />
    </radialGradient>

    <!-- Squircle Border Highlight -->
    <linearGradient id="squircleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.7" />
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.5" />
    </linearGradient>

    <!-- Layer 1: Top Intake (Electric Cyan to Azure) -->
    <linearGradient id="tier1Grad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Layer 2: Central Sifting Channel (Azure to Vibrant Violet) -->
    <linearGradient id="tier2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="60%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Layer 3: Bottom Organized Foundation (Purple to Radiant Rose) -->
    <linearGradient id="tier3Grad" x1="0%" y1="50%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <!-- Ambient glow filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop shadow for physical depth -->
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Squircle Base Tile -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGradient)" stroke="url(#squircleBorder)" stroke-width="2.5" />

  <!-- Background Ambient Aura -->
  <circle cx="256" cy="220" r="160" fill="#4f46e5" opacity="0.12" filter="url(#softGlow)" />

  <g filter="url(#dropShadow)">
    <!-- TIER 1: Top File Shelf (Incoming Files) -->
    <!-- Sweeps across top, curves down on the right -->
    <path d="M 148 160 
             C 148 136, 168 116, 192 116 
             L 324 116 
             C 348 116, 368 136, 368 160 
             L 368 178 
             C 368 202, 348 222, 324 222 
             L 236 222 
             C 216 222, 200 206, 200 186 
             C 200 166, 216 150, 236 150 
             L 316 150 
             C 324 150, 332 143, 332 135 
             C 332 127, 324 120, 316 120 
             L 192 120 
             C 170 120, 152 138, 152 160 
             C 152 182, 170 200, 192 200 
             L 220 200 
             C 200 208, 184 218, 172 230 
             L 164 216 
             C 154 200, 148 181, 148 160 Z" 
          fill="url(#tier1Grad)" />

    <!-- TIER 2: Central Sifting Ribbon (Classification & Triage) -->
    <!-- Dynamic diagonal bridge passing through the core -->
    <path d="M 368 196
             C 368 218, 354 238, 334 246
             L 216 294
             C 192 304, 176 328, 176 354
             L 176 364
             C 152 364, 136 348, 136 324
             L 136 312
             C 136 286, 152 262, 176 252
             L 294 204
             C 318 194, 334 170, 334 144
             L 334 140
             C 354 146, 368 169, 368 196 Z"
          fill="url(#tier2Grad)" opacity="0.96" />

    <!-- TIER 3: Bottom Organized Foundation (Foldered Results) -->
    <!-- Curves out to the right forming the bottom loop of the S -->
    <path d="M 364 352
             C 364 376, 344 396, 320 396
             L 188 396
             C 164 396, 144 376, 144 352
             L 144 334
             C 144 310, 164 290, 188 290
             L 276 290
             C 296 290, 312 306, 312 326
             C 312 346, 296 362, 276 362
             L 196 362
             C 188 362, 180 369, 180 377
             C 180 385, 188 392, 196 392
             L 320 392
             C 342 392, 360 374, 360 352
             C 360 330, 342 312, 320 312
             L 292 312
             C 312 304, 328 294, 340 282
             L 348 296
             C 358 312, 364 331, 364 352 Z"
          fill="url(#tier3Grad)" />

    <!-- Core Precision Diamond (The Sift Filter Hub) -->
    <path d="M 256 230 L 278 256 L 256 282 L 234 256 Z" fill="#ffffff" filter="url(#softGlow)" />
    <circle cx="256" cy="256" r="3" fill="#3b82f6" />

    <!-- Unsorted Files entering (Top Right) -->
    <rect x="390" y="128" width="22" height="10" rx="5" fill="#22d3ee" opacity="0.9" />
    <rect x="390" y="146" width="14" height="10" rx="5" fill="#818cf8" opacity="0.75" />

    <!-- Sorted Folders emerging (Bottom Left) -->
    <rect x="100" y="356" width="22" height="10" rx="5" fill="#fb7185" opacity="0.9" />
    <rect x="108" y="374" width="14" height="10" rx="5" fill="#c084fc" opacity="0.75" />
  </g>
</svg>