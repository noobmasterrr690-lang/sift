[package]
name = "sift"
version = "0.1.0"
description = "Sift — Native Desktop File Intelligence & Triage Suite"
authors = ["Sift Systems Engineering"]
edition = "2021"

[lib]
name = "sift_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.5"
notify = "6.1"
blake3 = "1.5"
infer = "0.16"
mime_guess = "2.0"
trash = "5.2"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5.0"
uuid = { version = "1.11", features = ["v4"] }
