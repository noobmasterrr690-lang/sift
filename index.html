<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Sift — Native File Intelligence & Triage Suite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      @keyframes splashPulse {
        0%, 100% { transform: scale(0.95); opacity: 0.45; }
        50% { transform: scale(1.15); opacity: 0.8; }
      }
      @keyframes splashBeam {
        0% { left: -35%; width: 25%; }
        50% { left: 25%; width: 50%; }
        100% { left: 100%; width: 25%; }
      }
    </style>
  </head>
  <body class="bg-zinc-950 text-zinc-100 antialiased selection:bg-indigo-500/30 selection:text-indigo-200 overflow-hidden">
    <div id="root">
      <div style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(120% 90% at 50% 20%, #1a1e36 0%, #101222 45%, #080910 100%);overflow:hidden;font-family:'Segoe UI Variable Text','Segoe UI',Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;">
        <div style="position:relative;width:96px;height:96px;display:grid;place-items:center;margin-bottom:20px;">
          <div style="position:absolute;inset:-18px;background:radial-gradient(circle,rgba(99,102,241,0.45) 0%,rgba(34,211,238,0.2) 40%,transparent 70%);border-radius:50%;filter:blur(16px);animation:splashPulse 2.8s ease-in-out infinite alternate;"></div>
          <img src="/app-ui/sift-logo.svg" alt="Sift" width="84" height="84" style="width:84px;height:84px;border-radius:20px;filter:drop-shadow(0 10px 28px rgba(79,70,229,0.5));position:relative;z-index:2;" onerror="this.src='/sift-logo.svg'" />
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
          <h1 style="font-size:38px;font-weight:800;letter-spacing:-0.03em;color:#ffffff;line-height:1;margin:0;text-shadow:0 2px 14px rgba(255,255,255,0.15);">Sift</h1>
          <span style="font-size:10px;font-weight:700;letter-spacing:0.26em;text-transform:uppercase;background:linear-gradient(90deg,#38bdf8 0%,#818cf8 50%,#ec4899 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-left:0.26em;">Precision File Organizer</span>
        </div>
        <div style="width:240px;height:4px;background:rgba(255,255,255,0.08);border-radius:999px;overflow:hidden;margin-top:26px;position:relative;">
          <div style="position:absolute;top:0;left:0;height:100%;border-radius:999px;background:linear-gradient(90deg,#22d3ee,#6366f1,#a855f7,#fb7185);box-shadow:0 0 12px rgba(99,102,241,0.6);animation:splashBeam 1.8s cubic-bezier(0.4,0,0.2,1) infinite;"></div>
        </div>
        <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;font-size:12px;color:#a8a8b3;font-weight:500;">
          <span style="width:6px;height:6px;border-radius:50%;background:#34d399;box-shadow:0 0 8px rgba(52,211,153,0.8);"></span>
          <span>Opening Sift…</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:36px;font-size:11px;color:#75757f;letter-spacing:0.04em;font-weight:500;">
          <span>⚡ 100% Local</span>
          <span style="opacity:0.35;color:#818cf8;">•</span>
          <span>Private</span>
          <span style="opacity:0.35;color:#818cf8;">•</span>
          <span>Windows Native</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
